// Top-level build file where you can add configuration options common to all sub-projects/modules.
    ext {
        buildToolsVersion = "35.0.0"        // RN 0.81 tested with 35.x
        minSdkVersion = 24
        compileSdkVersion = 35               // RN 0.81 targets API 35
        targetSdkVersion = 35                // Match compileSdkVersion
        ndkVersion = "28.2.13676358"         // Compatible NDK for RN 0.81
    }
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Force NDK 26 for all modules to fix C++ stdlib linking issues with NDK 27


// Force NDK 26 for all modules to fix C++ stdlib linking issues with NDK 27


apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
